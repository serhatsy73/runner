<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kule Savaşı</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#c4ebaa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="game"></canvas>

<header class="hud">
  <div class="hud-row">
    <button class="icon-btn" id="pauseBtn" type="button" aria-label="Duraklat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="2"/><rect x="13.8" y="5" width="4.2" height="14" rx="2"/></svg>
    </button>
    <div class="chip" id="lvl">Seviye 1</div>
    <span class="spacer"></span>
    <button class="btn small" id="restart" type="button">↻ Yeniden Başlat</button>
  </div>
  <div class="power" id="power" role="img" aria-label="Güç dengesi"></div>
</header>

<div class="map" id="map" hidden>
  <div class="map-inner">
    <header class="map-head">
      <div class="map-title">
        <h1>Kule Savaşı</h1>
        <span class="total" id="mapStars"></span>
      </div>
      <div class="map-tools">
        <button class="toggle" id="helpBtn" type="button">Nasıl oynanır?</button>
        <span id="mapToggles" class="map-toggles"></span>
      </div>
    </header>
    <div id="worlds"></div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
    <canvas id="ovArt" width="192" height="192" aria-hidden="true"></canvas>
    <h1 id="ovTitle"></h1>
    <div id="ovBody"></div>
    <div class="row" id="ovBtns"></div>
    <div class="toggles" id="ovToggles" hidden></div>
  </div>
</div>

<!-- Sıra önemli: her dosya window.KS üzerinden öncekileri kullanır -->
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/terrain.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/audio.js"></script>
<script src="js/monetization.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
